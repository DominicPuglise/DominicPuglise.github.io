<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dominic Puglise - Homepage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            background-color: #b8b8b8;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            width: 90%;
            background: #fff;
            padding: 40px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            text-align: center;
        }
         .profile-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px; /* space between picture and text */
            margin-bottom: 30px;
            flex-wrap: wrap; /* Wrap content on smaller screens*/
        }

        .profile-image {
            width: 150px;
            height: 150px;
            border-radius: 50%; /* Make it a circle */
            object-fit: cover; /* Crop image */
             border: 2px solid #3498db;
              transition: filter 0.2s; /* transition for blurring effect */
        }
          .profile-image.blur {
              filter: blur(5px);
          }
        .profile-description {
            flex: 1;
            text-align: left;
        }
         .profile-description h2{
            margin-bottom: 10px;
             color: #2c3e50;
        }

        h1 {
            color: #2c3e50;
            font-size: 2.5em;
            margin-bottom: 15px;
        }
        p {
            font-size: 1.1em;
            color: #777;
            margin-bottom: 30px;
        }
       .navigation {
            display: flex;
            justify-content: center;
            gap: 20px;
             margin-top: 30px;
            flex-wrap: wrap;
             position: relative;
        }
        .nav-button, .secret-button {
            padding: 15px 30px;
            background-color: #3498db;
            color: #fff;
            text-decoration: none;
            font-size: 1.2em;
            border-radius: 8px;
            transition: background 0.3s, transform 0.2s ease-in-out;
           box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .nav-button:hover {
             background-color: #2980b9;
             transform: translateY(-2px);
         }
         .secret-button{
              background-color: #fff;
              color: #fff;
              border: none; /* remove border*/
              position: absolute;
              right: -10px; /* move to right*/
              opacity: 0.7; /* reduce opacity*/
              box-shadow: none;
          }
         .secret-button:hover {
             background-color: #f0f0f0;
              transform: translateY(-2px);
             opacity: 1; /* increase opacity on hover*/
              box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
          }

        @media screen and (max-width: 600px) {
              .container {
                    padding: 20px;
                }
              .nav-button, .secret-button {
                    padding: 10px 20px;
                    font-size: 1em;
                }
                .profile-image {
                     width: 120px; /* Reduced size on smaller screens*/
                     height: 120px;
                }
                .profile-description{
                    text-align: center; /* Center description on smaller screens */
                }
                .profile-section {
                    gap: 20px;
                    margin-bottom: 20px; /* Reduced margin */
                }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile-section">
            <img class="profile-image" src="headshot.png" alt="Dominic Puglise">
            <div class="profile-description">
                 <h2>About Me</h2>
                <p>
                     Hello, my name is Dominic (Nick) Puglise. I am a third year mechancial 
                     engineering major currently attending Milwaukee School of Engineering (MSOE).

                 </p>
            </div>
        </div>
        <h1>Welcome to My Website</h1>
        <p>Select a section to explore:</p>
        <div class="navigation">
            <a href="academics.html" class="nav-button">Academics</a>
            <a href="Projects/projects.html" class="nav-button">Projects</a>
            <a href="personal.html" class="nav-button">Personal</a>
            <a href="secret.html" class="secret-button"> </a>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const profileImage = document.querySelector('.profile-image');
            let timerId;
            let originalSrc = profileImage.src; // Store the original src
            let isSwapped = false;
            let swappedElement;
            let audio = new Audio('song.mp3');
                audio.volume = 0.2; // Set initial volume to 50%
    
            profileImage.addEventListener('mouseenter', () => {
                timerId = setTimeout(() => {
                    if (!isSwapped) {
                        profileImage.classList.add('blur');
                        swappedElement = document.createElement('img');
                        swappedElement.src = 'swap.png';
                        swappedElement.classList.add('profile-image');
                        profileImage.parentNode.replaceChild(swappedElement, profileImage);
                        audio.play(); // Start playing audio
                      
    
                        swappedElement.addEventListener('mouseleave', () => {
                            if (isSwapped) {
                                swappedElement.parentNode.replaceChild(profileImage, swappedElement);
                                profileImage.classList.remove('blur');
                                audio.pause();  // Stop audio
                                audio.currentTime = 0;  // Reset audio to beginning
                            }
                            isSwapped = false;
                            clearTimeout(timerId);
                        });
                    }
                    isSwapped = true;
                }, 5000); // milliseconds = .3 seconds
            });
    
            profileImage.addEventListener('mouseleave', () => {
                clearTimeout(timerId);
                if (isSwapped) {
                    profileImage.classList.remove('blur');
                    audio.pause();
                    audio.currentTime = 0;
                }
                isSwapped = false;
            });
    
            if (profileImage.parentNode) {
                profileImage.parentNode.addEventListener('mouseleave', (event) => {
                    if (isSwapped && event.relatedTarget !== profileImage && !profileImage.contains(event.relatedTarget)) {
                         if (swappedElement) {
                            swappedElement.parentNode.replaceChild(profileImage, swappedElement);
                            profileImage.classList.remove('blur');
                              audio.pause();
                            audio.currentTime = 0;
                        }
                        isSwapped = false;
                        clearTimeout(timerId);
                    }
                });
            }
        });
    </script>
    
</body>
</html>
